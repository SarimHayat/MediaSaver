name: Build MediaSaver APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android SDK 35
        run: |
          SDK_BIN=$(command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager | head -n 1)
          (yes || true) | "$SDK_BIN" --licenses > /dev/null
          "$SDK_BIN" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload MediaSaver APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaSaver-APK
          path: app/build/outputs/apk/debug/app-debug.apk
